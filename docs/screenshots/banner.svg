<svg width="900" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#111922"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none" stroke="#1e2d3e" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#grid)" opacity="0.5"/>
  <!-- Circles -->
  <circle cx="120" cy="110" r="40" fill="none" stroke="#f0a500" stroke-width="1.5" opacity="0.2"/>
  <circle cx="120" cy="110" r="25" fill="none" stroke="#f0a500" stroke-width="1" opacity="0.3"/>
  <circle cx="120" cy="110" r="10" fill="#f0a500" opacity="0.4"/>
  <circle cx="780" cy="110" r="35" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>
  <circle cx="780" cy="110" r="20" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <circle cx="780" cy="110" r="8" fill="#00d4ff" opacity="0.4"/>
  <!-- Title -->
  <text x="450" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="38" font-weight="700" fill="#f0a500">🏭 OpenICS-Atlas</text>
  <text x="450" y="115" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7a8ea0">Map, simulate, and harden ICS/OT exposure</text>
  <text x="450" y="145" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#4a5d70">Shodan-aware · Vendor-neutral · Open source · 8 ICS protocols · Purdue Model · 72 hardening controls</text>
  <!-- Badges -->
  <rect x="295" y="165" width="65" height="22" rx="4" fill="#f0a50020" stroke="#f0a50040" stroke-width="1"/>
  <text x="327" y="180" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#f0a500">v2.0</text>
  <rect x="370" y="165" width="85" height="22" rx="4" fill="#ff475720" stroke="#ff475740" stroke-width="1"/>
  <text x="412" y="180" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#ff4757">ICS/SCADA</text>
  <rect x="465" y="165" width="75" height="22" rx="4" fill="#00d4ff20" stroke="#00d4ff40" stroke-width="1"/>
  <text x="502" y="180" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#00d4ff">IEC 62443</text>
  <rect x="550" y="165" width="65" height="22" rx="4" fill="#2ed57320" stroke="#2ed57340" stroke-width="1"/>
  <text x="582" y="180" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" font-weight="600" fill="#2ed573">DEFENSE</text>
